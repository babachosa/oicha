[workspace]
members = ["crates/oicha-core", "crates/oicha-app", "crates/oicha-update"]
resolver = "2"
exclude = ["vendor/grid"]

[patch.crates-io]
grid = { path = "vendor/grid" }

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

