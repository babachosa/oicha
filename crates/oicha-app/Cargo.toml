[package]
name = "oicha"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
oicha-core = { path = "../oicha-core" }
oicha-update = { path = "../oicha-update" }
gpui = "=0.2.2"
anyhow = "1"
directories = "6"
unicode-segmentation = "1.12"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.12"

