[package]
name = "oicha-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
ring = "=0.17.14"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# Minimum patched TLS release for RUSTSEC-2026-0346/0347/0348/0349.
rustls = { version = ">=0.23.46, <0.24", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "oicha-release"
path = "src/release.rs"
