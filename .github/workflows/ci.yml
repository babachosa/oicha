name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo test -p oicha-core --test security_regressions --release --locked
      - run: ./tools/check-dependencies.ps1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p oicha --release --locked
      - run: ./tools/build-windows-installer.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Oicha-Windows-x64
          path: |
            target/release/oicha.exe
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
            dist/*-Setup.exe.manifest.json
